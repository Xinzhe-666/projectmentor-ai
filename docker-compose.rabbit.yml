services:
  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    container_name: projectmentor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${ANALYSIS_RABBIT_USERNAME:?ANALYSIS_RABBIT_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${ANALYSIS_RABBIT_PASSWORD:?ANALYSIS_RABBIT_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${ANALYSIS_RABBIT_VHOST:?ANALYSIS_RABBIT_VHOST is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${ANALYSIS_RABBIT_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${ANALYSIS_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ANALYSIS_DISPATCH_MODE: rabbit
      ANALYSIS_RABBIT_HOST: rabbitmq
      ANALYSIS_RABBIT_PORT: 5672
      ANALYSIS_RABBIT_VHOST: ${ANALYSIS_RABBIT_VHOST:?ANALYSIS_RABBIT_VHOST is required}
      ANALYSIS_RABBIT_USERNAME: ${ANALYSIS_RABBIT_USERNAME:?ANALYSIS_RABBIT_USERNAME is required}
      ANALYSIS_RABBIT_PASSWORD: ${ANALYSIS_RABBIT_PASSWORD:?ANALYSIS_RABBIT_PASSWORD is required}
      ANALYSIS_RABBIT_MAIN_EXCHANGE: ${ANALYSIS_RABBIT_MAIN_EXCHANGE:-pmai.analysis.v1}
      ANALYSIS_RABBIT_MAIN_QUEUE: ${ANALYSIS_RABBIT_MAIN_QUEUE:-pmai.analysis.execute.v1}
      ANALYSIS_RABBIT_MAIN_ROUTING_KEY: ${ANALYSIS_RABBIT_MAIN_ROUTING_KEY:-analysis.execute.v1}
      ANALYSIS_RABBIT_RETRY_EXCHANGE: ${ANALYSIS_RABBIT_RETRY_EXCHANGE:-pmai.analysis.retry.v1}
      ANALYSIS_RABBIT_DLX: ${ANALYSIS_RABBIT_DLX:-pmai.analysis.dlx.v1}
      ANALYSIS_RABBIT_DLQ: ${ANALYSIS_RABBIT_DLQ:-pmai.analysis.dead.v1}
      ANALYSIS_RABBIT_DEAD_ROUTING_KEY: ${ANALYSIS_RABBIT_DEAD_ROUTING_KEY:-analysis.dead.v1}
      ANALYSIS_RABBIT_QUEUE_TYPE: ${ANALYSIS_RABBIT_QUEUE_TYPE:-quorum}
      ANALYSIS_RABBIT_CONFIRM_TIMEOUT_MILLIS: ${ANALYSIS_RABBIT_CONFIRM_TIMEOUT_MILLIS:-5000}
      ANALYSIS_OUTBOX_POLL_INTERVAL_MILLIS: ${ANALYSIS_OUTBOX_POLL_INTERVAL_MILLIS:-1000}
      ANALYSIS_OUTBOX_BATCH_SIZE: ${ANALYSIS_OUTBOX_BATCH_SIZE:-50}
      ANALYSIS_OUTBOX_CLAIM_LEASE_SECONDS: ${ANALYSIS_OUTBOX_CLAIM_LEASE_SECONDS:-30}
      ANALYSIS_OUTBOX_MAXIMUM_ATTEMPTS: ${ANALYSIS_OUTBOX_MAXIMUM_ATTEMPTS:-8}
      ANALYSIS_OUTBOX_INITIAL_BACKOFF_SECONDS: ${ANALYSIS_OUTBOX_INITIAL_BACKOFF_SECONDS:-5}
      ANALYSIS_OUTBOX_MAXIMUM_BACKOFF_SECONDS: ${ANALYSIS_OUTBOX_MAXIMUM_BACKOFF_SECONDS:-300}
      ANALYSIS_OUTBOX_PUBLISHED_RETENTION_HOURS: ${ANALYSIS_OUTBOX_PUBLISHED_RETENTION_HOURS:-168}
      ANALYSIS_RABBIT_CONSUMER_MIN_CONCURRENCY: ${ANALYSIS_RABBIT_CONSUMER_MIN_CONCURRENCY:-1}
      ANALYSIS_RABBIT_CONSUMER_MAX_CONCURRENCY: ${ANALYSIS_RABBIT_CONSUMER_MAX_CONCURRENCY:-4}
      ANALYSIS_RABBIT_PREFETCH: ${ANALYSIS_RABBIT_PREFETCH:-1}
      ANALYSIS_EXECUTION_LEASE_SECONDS: ${ANALYSIS_EXECUTION_LEASE_SECONDS:-120}
      ANALYSIS_EXECUTION_HEARTBEAT_SECONDS: ${ANALYSIS_EXECUTION_HEARTBEAT_SECONDS:-30}
      ANALYSIS_RECOVERY_SCAN_INTERVAL_MILLIS: ${ANALYSIS_RECOVERY_SCAN_INTERVAL_MILLIS:-5000}
      ANALYSIS_RECOVERY_BATCH_SIZE: ${ANALYSIS_RECOVERY_BATCH_SIZE:-50}
      ANALYSIS_EXECUTION_MAXIMUM_ATTEMPTS: ${ANALYSIS_EXECUTION_MAXIMUM_ATTEMPTS:-4}
      ANALYSIS_RETRY_TTL_SECONDS: ${ANALYSIS_RETRY_TTL_SECONDS:-10,60,300}

volumes:
  rabbitmq_data:
