server:
  port: 8080

spring:
  application:
    name: projectmentor-server

  servlet:
    multipart:
      max-file-size: 820MB
      max-request-size: 820MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projectmentor_ai}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发调试如需打印 SQL，可设置：
    # MYBATIS_PLUS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_PLUS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

projectmentor:
  admin:
    emails: ${ADMIN_EMAILS:}

  jwt:
    secret: ${JWT_SECRET:projectmentor-ai-local-dev-secret-must-be-at-least-32-chars}
    expire-hours: 24

  ai:
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    enabled: ${AI_ENABLED:true}
    max-prompt-chars: ${AI_MAX_PROMPT_CHARS:12000}
    max-response-tokens: ${AI_MAX_RESPONSE_TOKENS:1600}
    timeout-seconds: 60
