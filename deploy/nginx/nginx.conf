server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 820m;
    client_body_timeout 1200s;
    client_header_timeout 120s;
    send_timeout 1200s;

    if ($request_uri ~* "(?:/shell(?:[/?]|$)|wget|chmod|rm(?:\+|%20|%2b)-rf|GponForm|geoserver)") {
        return 403;
    }

    location ~* ^/(?:\.env(?:\.[A-Za-z0-9_.-]+)?|env\.json|runtime-env\.json)$ {
        return 404;
    }

    location = /assets/env.json {
        return 404;
    }

    location = /static/env.json {
        return 404;
    }

    location = /static/config.json {
        return 404;
    }

    location ~* \.(?:sql|dump|bak|backup|tar|tar\.gz|tgz|gz|zip|7z|rar)$ {
        return 404;
    }

    location ^~ /@fs/ {
        return 404;
    }

    location ~* ^/(?:__better_errors|_debug|trace\.axd|rails/info/routes|swagger|swagger-ui|v2/api-docs|v3/api-docs|actuator|graphql|v2/graphql)(?:/|$) {
        return 404;
    }

    location = /api/install {
        return 404;
    }

    location ^~ /api/install/ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /donate/ {
        try_files $uri =404;
    }

    location = /api {
        proxy_pass http://backend:8080/api;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
