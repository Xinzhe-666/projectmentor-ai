name: ProjectMentor AI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/projectmentor-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/projectmentor-server/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Package backend
        run: ./mvnw -B clean package -DskipTests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/projectmentor-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/projectmentor-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check repository hygiene
        run: bash scripts/check-repo-hygiene.sh

      - name: Check database migration hygiene
        run: bash scripts/check-db-migrations.sh

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail

          script_count=0
          while IFS= read -r -d '' script; do
            script_count=$((script_count + 1))
            printf 'Checking shell syntax: %s\n' "$script"
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0 | sort -z)

          if ((script_count == 0)); then
            printf 'No shell scripts found under scripts/.\n'
          fi

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          temporary_env='.env'
          if [[ -e "$temporary_env" ]]; then
            printf 'Refusing to overwrite existing %s\n' "$temporary_env" >&2
            exit 1
          fi
          trap 'rm -f "$temporary_env"' EXIT
          : >"$temporary_env"

          export MYSQL_ROOT_PASSWORD='ci-placeholder-mysql-root-password'
          export JWT_SECRET='ci-placeholder-jwt-secret-at-least-32-characters'

          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.fast.yml config --quiet

  database-migration:
    name: database-migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/projectmentor-server
    services:
      fresh_mysql:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: ci-database-migration-password
          MYSQL_DATABASE: projectmentor_ai
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-database-migration-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=30
      legacy_mysql:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: ci-database-migration-password
          MYSQL_DATABASE: projectmentor_ai
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-database-migration-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/projectmentor-server/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Package backend for migration smoke tests
        run: ./mvnw -B clean package -DskipTests

      - name: Verify fresh migration and legacy baseline
        shell: bash
        env:
          FRESH_MYSQL_CONTAINER: ${{ job.services.fresh_mysql.id }}
          FRESH_MYSQL_PORT: ${{ job.services.fresh_mysql.ports['3306'] }}
          LEGACY_MYSQL_CONTAINER: ${{ job.services.legacy_mysql.id }}
          LEGACY_MYSQL_PORT: ${{ job.services.legacy_mysql.ports['3306'] }}
          MYSQL_ROOT_PASSWORD: ci-database-migration-password
          JWT_SECRET: ci-database-migration-jwt-secret-at-least-32-characters
        run: |
          set -euo pipefail

          readonly database_name='projectmentor_ai'
          readonly baseline_migration_file='src/main/resources/db/migration/V1__baseline_schema.sql'
          readonly expected_table_count='16'
          app_pid=''
          app_log=''

          stop_app() {
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            app_pid=''
          }

          cleanup() {
            exit_status=$?
            stop_app
            if ((exit_status != 0)) && [[ -n "$app_log" && -f "$app_log" ]]; then
              printf '%s\n' 'Backend log tail:' >&2
              tail -n 200 "$app_log" >&2
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          mapfile -d '' -t backend_jars < <(
            find target -maxdepth 1 -type f -name '*.jar' -print0
          )
          if ((${#backend_jars[@]} != 1)); then
            printf 'Expected exactly one packaged backend jar, found %d.\n' "${#backend_jars[@]}" >&2
            exit 1
          fi
          readonly backend_jar="${backend_jars[0]}"

          query_database() {
            local container_id="$1"
            local sql="$2"
            docker exec \
              -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" \
              "$container_id" \
              mysql --protocol=TCP -h 127.0.0.1 -uroot \
              --database="$database_name" --batch --skip-column-names \
              --execute="$sql"
          }

          assert_query_equals() {
            local container_id="$1"
            local sql="$2"
            local expected="$3"
            local label="$4"
            local actual
            actual="$(query_database "$container_id" "$sql")"
            if [[ "$actual" != "$expected" ]]; then
              printf '%s: expected %s, got %s.\n' "$label" "$expected" "$actual" >&2
              exit 1
            fi
          }

          assert_schema_integrity() {
            local container_id="$1"
            local database_label="$2"

            assert_query_equals \
              "$container_id" \
              "SELECT COUNT(*) FROM information_schema.statistics
               WHERE table_schema = '$database_name'
                 AND table_name = 'pm_user'
                 AND index_name = 'uk_user_email'
                 AND non_unique = 0
                 AND column_name = 'email'
                 AND seq_in_index = 1;" \
              '1' \
              "$database_label unique email index"
            assert_query_equals \
              "$container_id" \
              "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',')
               FROM information_schema.statistics
               WHERE table_schema = '$database_name'
                 AND table_name = 'pm_project_file'
                 AND index_name = 'uk_project_file_path'
                 AND non_unique = 0;" \
              'project_id,file_path' \
              "$database_label project file unique column order"
            assert_query_equals \
              "$container_id" \
              "SELECT CAST(column_default AS CHAR) FROM information_schema.columns
               WHERE table_schema = '$database_name'
                 AND table_name = 'pm_user_plan'
                 AND column_name = 'remaining_credits';" \
              '10' \
              "$database_label remaining credits default"
            assert_query_equals \
              "$container_id" \
              "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',')
               FROM information_schema.statistics
               WHERE table_schema = '$database_name'
                 AND table_name = 'pm_project_qa_record'
                 AND index_name = 'idx_qa_project_id'
                 AND non_unique = 1;" \
              'project_id' \
              "$database_label QA project index"
          }

          post_json() {
            local url="$1"
            local payload="$2"
            local token="${3:-}"
            local curl_args=(
              --fail
              --silent
              --show-error
              --request POST
              --header 'Content-Type: application/json'
              --data "$payload"
            )
            if [[ -n "$token" ]]; then
              curl_args+=(--header "Authorization: Bearer $token")
            fi
            curl "${curl_args[@]}" "$url"
          }

          assert_api_success() {
            local response="$1"
            local label="$2"
            if ! jq --exit-status '.code == 0' <<<"$response" >/dev/null; then
              printf '%s returned a non-success API result.\n' "$label" >&2
              exit 1
            fi
          }

          verify_project_file_mapper_upsert() {
            local container_id="$1"
            local register_response
            local auth_token
            local first_project_response
            local first_project_id
            local second_project_response
            local second_project_id
            local api_response

            command -v jq >/dev/null 2>&1 || {
              printf '%s\n' 'jq is required for the Mapper upsert smoke test.' >&2
              exit 1
            }

            register_response="$(post_json \
              'http://127.0.0.1:8080/api/auth/register' \
              '{"username":"ci_v491_upsert","password":"ci-test-password-491","email":"ci-v491-upsert@example.invalid"}')"
            assert_api_success "$register_response" 'test user registration'
            auth_token="$(jq --exit-status --raw-output \
              '.data.token | strings | select(length > 0)' <<<"$register_response")"

            first_project_response="$(post_json \
              'http://127.0.0.1:8080/api/projects' \
              '{"name":"CI V4.9-1 Mapper Project A"}' \
              "$auth_token")"
            assert_api_success "$first_project_response" 'first project creation'
            first_project_id="$(jq --exit-status --raw-output '.data.id | numbers' \
              <<<"$first_project_response")"

            second_project_response="$(post_json \
              'http://127.0.0.1:8080/api/projects' \
              '{"name":"CI V4.9-1 Mapper Project B"}' \
              "$auth_token")"
            assert_api_success "$second_project_response" 'second project creation'
            second_project_id="$(jq --exit-status --raw-output '.data.id | numbers' \
              <<<"$second_project_response")"

            if [[ ! "$first_project_id" =~ ^[0-9]+$ || ! "$second_project_id" =~ ^[0-9]+$ ]]; then
              printf '%s\n' 'Project creation returned a non-numeric id.' >&2
              exit 1
            fi

            api_response="$(post_json \
              "http://127.0.0.1:8080/api/projects/$first_project_id/readme" \
              '{"content":"CI README first version"}' \
              "$auth_token")"
            assert_api_success "$api_response" 'first README write'

            query_database "$container_id" \
              "UPDATE pm_project_file SET file_type = 'OTHER'
               WHERE project_id = $first_project_id AND file_path = 'README.md';"

            api_response="$(post_json \
              "http://127.0.0.1:8080/api/projects/$first_project_id/readme" \
              '{"content":"CI README second version"}' \
              "$auth_token")"
            assert_api_success "$api_response" 'second README write'

            api_response="$(post_json \
              "http://127.0.0.1:8080/api/projects/$second_project_id/readme" \
              '{"content":"CI README other project"}' \
              "$auth_token")"
            assert_api_success "$api_response" 'other project README write'

            assert_query_equals \
              "$container_id" \
              "SELECT COUNT(*) FROM pm_project_file
               WHERE project_id = $first_project_id
                 AND file_path = 'README.md'
                 AND file_type = 'README'
                 AND content = 'CI README second version';" \
              '1' \
              'Mapper same-key README upsert result'
            assert_query_equals \
              "$container_id" \
              "SELECT COUNT(*) FROM pm_project_file
               WHERE project_id IN ($first_project_id, $second_project_id)
                 AND file_path = 'README.md';" \
              '2' \
              'Mapper same path across different projects'
          }

          start_app() {
            local database_port="$1"
            local baseline_on_migrate="$2"
            local log_name="$3"
            local ready='false'

            app_log="$RUNNER_TEMP/$log_name"
            DB_HOST='127.0.0.1' \
            DB_PORT="$database_port" \
            DB_NAME="$database_name" \
            DB_USERNAME='root' \
            DB_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            JWT_SECRET="$JWT_SECRET" \
            AI_ENABLED='false' \
            EMAIL_VERIFICATION_ENABLED='false' \
            FLYWAY_ENABLED='true' \
            FLYWAY_BASELINE_ON_MIGRATE="$baseline_on_migrate" \
              java -jar "$backend_jar" >"$app_log" 2>&1 &
            app_pid=$!

            for _ in {1..60}; do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                break
              fi
              if curl --fail --silent --show-error \
                'http://127.0.0.1:8080/api/health' >/dev/null 2>&1; then
                ready='true'
                break
              fi
              sleep 2
            done

            if [[ "$ready" != 'true' ]]; then
              printf 'Backend did not become healthy with baseline-on-migrate=%s.\n' \
                "$baseline_on_migrate" >&2
              exit 1
            fi
          }

          readonly business_tables="
            'pm_user',
            'pm_user_plan',
            'pm_credit_log',
            'pm_project',
            'pm_project_file',
            'pm_project_qa_record',
            'pm_feedback',
            'pm_analysis_report',
            'pm_report_share',
            'pm_interview_session',
            'pm_interview_message',
            'pm_analysis_task',
            'pm_ai_call_log',
            'pm_defense_session',
            'pm_defense_question',
            'pm_defense_answer'
          "

          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            "SELECT default_collation_name FROM information_schema.schemata
             WHERE schema_name = '$database_name';" \
            'utf8mb4_unicode_ci' \
            'fresh database collation'
          start_app "$FRESH_MYSQL_PORT" 'false' 'fresh-migration-backend.log'
          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema = '$database_name'
               AND table_name IN ($business_tables);" \
            "$expected_table_count" \
            'fresh business table count'
          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '1'
               AND type = 'SQL'
               AND script = 'V1__baseline_schema.sql'
               AND success = 1;" \
            '1' \
            'fresh V1 SQL history'
          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '2'
               AND type = 'SQL'
               AND script = 'V2__schema_integrity_constraints.sql'
               AND success = 1;" \
            '1' \
            'fresh V2 SQL history'
          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '3'
               AND type = 'SQL'
               AND script = 'V3__defense_domain.sql'
               AND success = 1;" \
            '1' \
            'fresh V3 SQL history'
          assert_query_equals \
            "$FRESH_MYSQL_CONTAINER" \
            'SELECT COUNT(*) FROM flyway_schema_history;' \
            '3' \
            'fresh history row count'
          assert_schema_integrity "$FRESH_MYSQL_CONTAINER" 'fresh'
          verify_project_file_mapper_upsert "$FRESH_MYSQL_CONTAINER"
          stop_app

          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT default_collation_name FROM information_schema.schemata
             WHERE schema_name = '$database_name';" \
            'utf8mb4_unicode_ci' \
            'legacy database collation'
          docker exec -i \
            -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" \
            "$LEGACY_MYSQL_CONTAINER" \
            mysql --protocol=TCP -h 127.0.0.1 -uroot \
            --database="$database_name" <"$baseline_migration_file"

          query_database \
            "$LEGACY_MYSQL_CONTAINER" \
            "INSERT INTO pm_user (id, username, password, email)
               VALUES (910001, 'ci_v491_legacy_user', 'ci-fixture-not-a-real-password',
                       'ci-v491-legacy@example.invalid');
             INSERT INTO pm_user_plan (id, user_id, remaining_credits)
               VALUES (910001, 910001, 4);
             INSERT INTO pm_project (id, user_id, name)
               VALUES (910001, 910001, 'CI V4.9-1 legacy sentinel project');
             INSERT INTO pm_project_file (id, project_id, file_path, file_type, content)
               VALUES (910001, 910001, 'README.md', 'README',
                       'CI V4.9-1 legacy sentinel content');"

          start_app "$LEGACY_MYSQL_PORT" 'true' 'legacy-baseline-backend.log'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema = '$database_name'
               AND table_name IN ($business_tables);" \
            "$expected_table_count" \
            'legacy business table count'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '1'
               AND type = 'BASELINE'
               AND success = 1;" \
            '1' \
            'legacy V1 baseline history'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '1' AND type = 'SQL';" \
            '0' \
            'legacy V1 SQL skip'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '2'
               AND type = 'SQL'
               AND script = 'V2__schema_integrity_constraints.sql'
               AND success = 1;" \
            '1' \
            'legacy V2 SQL history'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*) FROM flyway_schema_history
             WHERE version = '3'
               AND type = 'SQL'
               AND script = 'V3__defense_domain.sql'
               AND success = 1;" \
            '1' \
            'legacy V3 SQL history'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            'SELECT COUNT(*) FROM flyway_schema_history;' \
            '3' \
            'legacy history row count'
          assert_query_equals \
            "$LEGACY_MYSQL_CONTAINER" \
            "SELECT COUNT(*)
             FROM pm_user AS u
             JOIN pm_user_plan AS plan ON plan.user_id = u.id
             JOIN pm_project AS project ON project.user_id = u.id
             JOIN pm_project_file AS file ON file.project_id = project.id
             WHERE u.id = 910001
               AND u.email = 'ci-v491-legacy@example.invalid'
               AND plan.remaining_credits = 4
               AND project.id = 910001
               AND file.id = 910001
               AND file.file_path = 'README.md'
               AND file.content = 'CI V4.9-1 legacy sentinel content';" \
            '1' \
            'legacy sentinel data preservation'
          assert_schema_integrity "$LEGACY_MYSQL_CONTAINER" 'legacy'
          stop_app

          printf '%s\n' \
            'PASS fresh V1/V2, legacy baseline/V2, schema integrity, and Mapper upsert validation'
