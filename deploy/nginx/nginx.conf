map $request_uri $pmai_obvious_scan {
    default 0;

    # ACME tokens must remain reachable even if a token contains a scan keyword.
    ~*^/\.well-known/acme-challenge/ 0;
    ~*(?:/shell|wget|chmod|rm(?:\+|%20|%2b)-rf|GponForm|geoserver) 1;
}

server {
    listen 80;
    server_name projectmentorai.com www.projectmentorai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name projectmentorai.com www.projectmentorai.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/projectmentorai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectmentorai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 820m;
    client_body_timeout 1200s;
    client_header_timeout 120s;
    send_timeout 1200s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Reject explicit scanner payloads before proxying or serving the SPA.
    if ($pmai_obvious_scan) {
        return 403;
    }

    # Sensitive configuration files must never fall back to index.html.
    location ~* ^/(?:\.env(?:[.-][A-Za-z0-9_.-]+)?|env\.json|runtime-env\.json|assets/env\.json|static/(?:env|config)\.json)$ {
        return 404;
    }

    # Block direct requests for database backups and archive files.
    location ~* \.(?:sql|dump|bak|backup|tar(?:\.gz)?|tgz|gz|zip|7z|rar)$ {
        return 404;
    }

    # Development, diagnostics, and public API documentation stay private.
    location ^~ /@fs/ {
        return 404;
    }

    location ~* ^/(?:__better_errors|_debug|trace\.axd|rails/info/routes|swagger(?:-ui)?|swagger-ui\.html|doc\.html|webjars|v2/api-docs|v3/api-docs|actuator|graphql|v2/graphql)(?:/|$) {
        return 404;
    }

    location = /api/install {
        return 404;
    }

    location ^~ /api/install/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /donate/ {
        try_files $uri =404;
    }

    location = /api {
        proxy_pass http://backend:8080/api;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
