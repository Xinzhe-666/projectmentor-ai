name: ProjectMentor AI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/projectmentor-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/projectmentor-server/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Package backend
        run: ./mvnw -B clean package -DskipTests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/projectmentor-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/projectmentor-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check repository hygiene
        run: bash scripts/check-repo-hygiene.sh

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail

          script_count=0
          while IFS= read -r -d '' script; do
            script_count=$((script_count + 1))
            printf 'Checking shell syntax: %s\n' "$script"
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0 | sort -z)

          if ((script_count == 0)); then
            printf 'No shell scripts found under scripts/.\n'
          fi

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          temporary_env='.env'
          if [[ -e "$temporary_env" ]]; then
            printf 'Refusing to overwrite existing %s\n' "$temporary_env" >&2
            exit 1
          fi
          trap 'rm -f "$temporary_env"' EXIT
          : >"$temporary_env"

          export MYSQL_ROOT_PASSWORD='ci-placeholder-mysql-root-password'
          export JWT_SECRET='ci-placeholder-jwt-secret-at-least-32-characters'

          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.fast.yml config --quiet
